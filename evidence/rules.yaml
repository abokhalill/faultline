# Evidence ledger. The tool reads this to decide which rules are on by
# default; nothing here is hand-set policy.
#
# Two properties make it a ratchet rather than documentation:
#
#   1. `source_sha` is the hash of the rule's implementation at the time the
#      evidence was gathered. Edit the rule and its evidence is stale by
#      construction -- the tier falls to experimental until re-measured. A
#      rule cannot be shipped as measured after being changed.
#
#   2. Tier is DERIVED from the numbers below by tools/rule_tier.py, and a
#      gate fails the build if a rule claims more than its evidence carries.
#      The mechanism-claim contract nearly became decorative because nothing
#      checked it; this does not repeat that.
#
# Thresholds (tools/rule_tier.py is authoritative):
#   measured  : precision_n >= 30, precision >= 0.60, adjudicators >= 2
#   confirmed : measured, plus recall_pairs >= 5 and physical.confirmed
#
# Today every rule is experimental and the default-on set is empty. That is
# the honest state and the product says so rather than hiding it.

schema: 1

rules:
  FL001:
    precision: {n: 6, tp: 0, tp_nwf: 5, fp: 1, adjudicators: [architect]}
    corpus: memcached
    note: >
      5 of 6 were TP-NWF: correct about layout, on cold paths. Precision is
      not the problem for this rule; actionability is. Needs a fresh sample
      and a second adjudicator before it means anything.
  FL002:
    precision: {n: 6, tp: 1, tp_nwf: 0, fp: 5, adjudicators: [architect]}
    corpus: memcached
    note: >
      0.17 at High. Single adjudicator who authored the rule, so anchoring
      risk is maximal. Two FPs since removed by ownership-transfer
      reasoning, which invalidates this sample rather than improving it.
  FL003: {}
