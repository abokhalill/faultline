# FL020 sees no allocation in a codebase that wraps libc unless it is told
# the wrapper names.
allocator_function_patterns:
  - "canary_alloc*"
  - "canary_release_buf"

# Same trap one subsystem over: FL012 matches pthread_ by name, and the
# codebases it targets reach their mutexes through a wrapper.
lock_function_patterns:
  - "canary_shmtx_lock"
unlock_function_patterns:
  - "canary_shmtx_unlock"

# FL070 grades mapping size, so the size parameter index is explicit: a
# wrapper like ngx_memalign(alignment, size, log) puts it second.
mapping_function_patterns:
  - "canary_map_arena:0"
