# SPDX-License-Identifier: Apache-2.0
# lshaz SARIF Upload. Runs lshaz and uploads results to GitHub Code Scanning.
#
# Usage: Copy this file to .github/workflows/ in any project that uses lshaz.
# Requires compile_commands.json in the repo (run lshaz init first).

name: lshaz Code Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  lshaz-sarif:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM/Clang build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-18-dev libclang-18-dev clang-18 cmake

      - name: Install lshaz
        run: |
          curl -sL https://raw.githubusercontent.com/abokhalill/lshaz/main/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run lshaz
        run: |
          set +e
          lshaz scan . --no-ir --format sarif --output results.sarif
          rc=$?
          set -e
          # 0 clean, 1 findings. 2 means TUs failed to compile, so absent
          # findings mean "not analyzed", not "not present" -- surface it
          # rather than let a broken scan read as a clean one.
          case $rc in
            0|1) ;;
            2) echo "::warning title=lshaz::Some translation units failed to compile; findings are incomplete" ;;
            *) echo "::error title=lshaz::lshaz failed (exit $rc)"; exit $rc ;;
          esac


      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: lshaz
